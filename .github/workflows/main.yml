name: HINLINK-ALL

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      BUILD_CONFIG_ONLY:
        description: '仅输出完整配置，不编译固件'
        required: true
        default: false
        type: boolean
      source_ref:
        description: '官方 ImmortalWrt 分支或 commit（默认 master）'
        required: false
        default: 'master'
        type: string

  schedule:
    - cron: "16 16 * * *"

env:
  OPENWRT_NAME: ImmortalWrt
  REPO: googlewmb/hinlink-all
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.source_ref || 'master' }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part3.sh
  UPLOAD_BIN: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    strategy:
      matrix:
        config:
          - h28k.config
          - h29k-v1.3-1.14.config
          - h29k-v5-1.14.config
          - h29k-v5-1.49.config
          - h66k.config
          - h68k-a-b-usb.config
          - h68k-a-b.config
          - h68k-c-d-f-usb.config
          - h68k-c-d-f.config
          - h68k-new.config
          - h69k-mini.config
          - h69k.config
          - h88k-v2.config
          - h88k-v3.config
          - h89k.config
          - ht2.config
      fail-fast: false

    env:
      CONFIG_BUILD: configs/${{ matrix.config }}
      BUILD_CONFIG_ONLY: ${{ github.event.inputs.BUILD_CONFIG_ONLY || 'false' }}

    runs-on: ubuntu-latest

    steps:
      - name: 释放Ubuntu磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 初始化环境
        run: |
          sudo timedatectl set-timezone "$TZ"
          sudo apt-get update -y
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file \
            wget curl jq tree

      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          path: work

      - name: 克隆官方 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt
          echo "官方源码 commit: $(cd openwrt && git rev-parse --short HEAD)"

      - name: 注入 Beaverfffan 适配层（完整正确版）
        run: |
          set -e
          echo "正在拉取 Beaverfffan 适配层..."
          git clone --depth 1 https://github.com/Beaverfffan/immortalwrt-hinlink.git hinlink-adapt

          # ---------- 1. DTS + board.d + rockchip 文件 ----------
          echo ">>> 复制 DTS / board.d / rockchip 文件"
          cp -rf hinlink-adapt/target/linux/rockchip/* openwrt/target/linux/rockchip/

          # ---------- 2. 自定义包 ----------
          echo ">>> 复制 package/beaverfffan"
          mkdir -p openwrt/package/beaverfffan
          cp -rf hinlink-adapt/package/beaverfffan/* openwrt/package/beaverfffan/

          # ---------- 3. 内核 patch ----------
          echo ">>> 复制内核 patch"
          if [ -d hinlink-adapt/patches ]; then
            mkdir -p openwrt/target/linux/rockchip/patches-6.18
            cp -f hinlink-adapt/patches/*.patch openwrt/target/linux/rockchip/patches-6.18/ 2>/dev/null || true
          fi

          # ---------- 4. U-Boot（严格按官方 README §七）----------
          echo ">>> 注入 U-Boot（出固件必需）"
          UBOOT_PKG="openwrt/package/boot/uboot-rockchip"
          mkdir -p "${UBOOT_PKG}/patches"

          # 4.1 上游 H28K / H66K / H68K 补丁
          if [ -d hinlink-adapt/patches-uboot/upstream ]; then
            cp -f hinlink-adapt/patches-uboot/upstream/*.patch "${UBOOT_PKG}/patches/"
            echo "  upstream 补丁已复制"
          fi

          # 4.2 H29K / HT2（108）+ RK3588（109）板级补丁
          for p in hinlink-adapt/patches-uboot/108-*.patch hinlink-adapt/patches-uboot/109-*.patch; do
            [ -f "$p" ] || continue
            cp -f "$p" "${UBOOT_PKG}/patches/"
            echo "  已复制 $(basename "$p")"
          done

          # 4.3 登记 8 个变体到 Makefile（最关键）
          if ls hinlink-adapt/patches-uboot/0001-*.patch 1>/dev/null 2>&1; then
            echo "  应用 0001-register-hinlink-devices.patch"
            patch -p1 -d "${UBOOT_PKG}" < hinlink-adapt/patches-uboot/0001-*.patch
          else
            echo "错误：找不到 0001 补丁！"
            exit 1
          fi

          # 4.4 验证登记是否成功
          echo ">>> 验证 U-Boot Makefile 中的 hinlink 条目："
          if ! grep -q 'hinlink-h68k-rk3568\|hinlink-h28k-rk3528' "${UBOOT_PKG}/Makefile"; then
            echo "错误：0001 补丁应用后 Makefile 仍无 hinlink 定义！"
            exit 1
          fi
          grep -n 'hinlink' "${UBOOT_PKG}/Makefile" | head -20

          echo ">>> 当前 patches 列表："
          ls -1 "${UBOOT_PKG}/patches/" | sort

          # ---------- 5. 追加设备定义 ----------
          echo ">>> 追加 armv8.mk.hinlink"
          if [ -f hinlink-adapt/target/linux/rockchip/image/armv8.mk.hinlink ]; then
            if ! grep -q 'Device/hinlink\|hinlink_opc-h68k\|hinlink_h28k' openwrt/target/linux/rockchip/image/armv8.mk 2>/dev/null; then
              cat hinlink-adapt/target/linux/rockchip/image/armv8.mk.hinlink \
                >> openwrt/target/linux/rockchip/image/armv8.mk
              echo "  已追加 armv8.mk.hinlink"
            else
              echo "  armv8.mk 已包含 hinlink 定义，跳过"
            fi
          fi

          echo "========== 适配层注入完成 =========="

      - name: 加载配置并强制启用正确 U-Boot 包
        run: |
          set -e
          cd openwrt

          # 复制种子配置
          cp "../work/${CONFIG_BUILD}" .config

          # 根据机型强制打开对应 U-Boot 包
          CFG="${{ matrix.config }}"
          case "$CFG" in
            h28k.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h28k-rk3528=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3528=y" >> .config
              ;;
            h29k-v1.3-1.14.config|h29k-v5-1.14.config|h29k-v5-1.49.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h29k-rk3528=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3528=y" >> .config
              ;;
            ht2.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-ht2-rk3528=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3528=y" >> .config
              ;;
            h66k.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h66k-rk3568=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3568=y" >> .config
              ;;
            h68k-a-b.config|h68k-a-b-usb.config|h68k-c-d-f.config|h68k-c-d-f-usb.config|h68k-new.config|h69k.config|h69k-mini.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h68k-rk3568=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3568=y" >> .config
              ;;
            h88k-v2.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h88k-v2-rk3588=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3588=y" >> .config
              ;;
            h88k-v3.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h88k-v3-rk3588=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3588=y" >> .config
              ;;
            h89k.config)
              echo "CONFIG_PACKAGE_u-boot-hinlink-h89k-rk3588=y" >> .config
              echo "CONFIG_PACKAGE_trusted-firmware-a-rk3588=y" >> .config
              ;;
          esac

          # 清旧 metadata
          rm -f tmp/.packageinfo tmp/.targetinfo tmp/.config-package.in tmp/.packagedeps tmp/.config-target.in

          make defconfig

          echo ">>> 最终启用的 u-boot / ATF 包："
          grep -E 'CONFIG_PACKAGE_u-boot-hinlink|CONFIG_PACKAGE_trusted-firmware-a' .config || true

          # 再次确认关键包是否真的被选中
          if ! grep -q 'CONFIG_PACKAGE_u-boot-hinlink.*=y' .config; then
            echo "错误：U-Boot 包没有被正确启用！请检查 0001 补丁和设备定义。"
            exit 1
          fi

      - name: 执行 diy-part1.sh
        run: |
          cd openwrt
          if [ -f "../work/${DIY_P1_SH}" ]; then
            chmod +x "../work/${DIY_P1_SH}"
            bash "../work/${DIY_P1_SH}"
          fi

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 卸掉与 beaverfffan 冲突的同名包
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled 2>/dev/null || true

      - name: 执行 diy-part3.sh
        run: |
          cd openwrt
          if [ -f "../work/${DIY_P2_SH}" ]; then
            chmod +x "../work/${DIY_P2_SH}"
            bash "../work/${DIY_P2_SH}"
          fi

      - name: 下载依赖
        if: env.BUILD_CONFIG_ONLY != 'true'
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        if: env.BUILD_CONFIG_ONLY != 'true'
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) V=s || make -j1 V=s
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: 生成完整配置（仅配置模式）
        if: env.BUILD_CONFIG_ONLY == 'true'
        run: |
          cd openwrt
          make defconfig
          echo "仅输出完整配置，跳过编译"

      - name: 整理产物
        if: always() && steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          mkdir -p firmware
          # 收集固件
          find bin/targets -name "*.img.gz" -o -name "*.bin" -o -name "*.tar.gz" | while read f; do
            cp -f "$f" firmware/ || true
          done
          # 收集 sha256sum
          find bin/targets -name "sha256sums" | while read f; do
            cp -f "$f" firmware/ || true
          done
          ls -lh firmware/ || true

      - name: 上传固件 Artifact
        if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-${{ matrix.config }}-${{ github.run_number }}
          path: openwrt/firmware/
          retention-days: 7

      - name: 上传 bin 目录（可选）
        if: env.UPLOAD_BIN == 'true' && steps.compile.outputs.status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.config }}-${{ github.run_number }}
          path: openwrt/bin/
          retention-days: 3

      - name: 创建 Release
        if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.config }}-${{ github.run_number }}
          name: ${{ matrix.config }} (${{ github.run_number }})
          body: |
            ImmortalWrt HinLink 固件
            配置：${{ matrix.config }}
            源码：${{ env.REPO_URL }} @ ${{ env.REPO_BRANCH }}
            构建时间：${{ github.run_id }}
          files: openwrt/firmware/*
          draft: false
          prerelease: false

      - name: config 文件上传自动更新1
        if: always()
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: config 文件上传自动更新2
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone -b main "https://github.com/${REPO}.git" main

      - name: config 文件上传自动更新3
        if: always()
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/main/configs"
          if [ -f ./openwrt/.config ]; then
            cp ./openwrt/.config \
              "${GITHUB_WORKSPACE}/main/configs/${{ matrix.config }}.full.config"

            cd "$GITHUB_WORKSPACE/main"
            git add "configs/${{ matrix.config }}.full.config"

            if git diff --cached --quiet; then
              echo "nothing to commit"
            else
              git commit -m "add full config for ${{ matrix.config }} $(date '+%Y-%m-%d %H:%M:%S')"

              for i in 1 2 3 4 5; do
                git pull --rebase origin main || true
                if git push --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git" HEAD:main; then
                  echo "push success"
                  break
                fi
                echo "push failed, retry $i ..."
                sleep 10
              done
            fi
          fi

      - name: 查看磁盘使用情况
        if: (!cancelled())
        run: df -hT

      - name: 删除旧工作流记录
        uses: Mattraks/delete-workflow-runs@main
        with:
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 0
