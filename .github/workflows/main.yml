name: HINLINK-ALL

permissions: write-all

on:
  workflow_dispatch:
    inputs:
      BUILD_CONFIG_ONLY:
        description: '仅输出完整配置，不编译固件'
        required: true
        default: false
        type: boolean
      source_ref:
        description: '官方 ImmortalWrt 分支或 commit（默认 master）'
        required: false
        default: 'master'
        type: string

  schedule:
    - cron: "16 16 * * *"

env:
  OPENWRT_NAME: ImmortalWrt
  REPO: googlewmb/Rockchip-H68K
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: ${{ github.event.inputs.source_ref || 'master' }}
  DIY_P1_SH: hinlink-all/diy-part1.sh
  DIY_P2_SH: hinlink-all/diy-part3.sh
  UPLOAD_BIN: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    strategy:
      matrix:
        config:
          - h28k.config
          - h29k-v1.3-1.14.config
          - h29k-v5-1.14.config
          - h29k-v5-1.49.config
          - h66k.config
          - h68k-a-b-usb.config
          - h68k-a-b.config
          - h68k-c-d-f-usb.config
          - h68k-c-d-f.config
          - h68k-new.config
          - h69k-mini.config
          - h69k.config
          - h88k-v2.config
          - h88k-v3.config
          - h89k.config
          - ht2.config
      fail-fast: false

    env:
      CONFIG_BUILD: hinlink-all/configs/${{ matrix.config }}
      BUILD_CONFIG_ONLY: ${{ github.event.inputs.BUILD_CONFIG_ONLY || 'false' }}

    runs-on: ubuntu-latest

    steps:
      - name: 释放Ubuntu磁盘空间
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 加载项目文件
        uses: actions/checkout@main

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get full-upgrade -y
          sudo apt-get install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: 设置当前的日期
        run: |
          sudo timedatectl set-timezone "$TZ"
          echo "date1=$(date +'%Y.%m.%d-%H.%M')" >> "$GITHUB_ENV"
          echo "date2=$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"
          echo "date3=$(date +'%Y年%m月%d日')" >> "$GITHUB_ENV"

      # ========== 1. 克隆官方 ImmortalWrt ==========
      - name: 下载官方 ImmortalWrt 源码
        run: |
          git clone --depth 1 -b "${REPO_BRANCH}" "${REPO_URL}" openwrt
          echo "官方源码 commit: $(git -C openwrt rev-parse --short HEAD)"

      # ========== 2. 自动注入 Beaverfffan 适配层 ==========
      - name: 注入 Beaverfffan 适配层
        run: |
          echo "正在拉取 Beaverfffan 适配层..."
          git clone --depth 1 https://github.com/Beaverfffan/immortalwrt-hinlink.git hinlink-adapt

          # 设备树 + 板级文件
          cp -rf hinlink-adapt/target/linux/rockchip/* openwrt/target/linux/rockchip/

          # 自定义包（风扇 / OLED / 5G复位 / aic8800 等）
          mkdir -p openwrt/package/beaverfffan
          cp -rf hinlink-adapt/package/beaverfffan/* openwrt/package/beaverfffan/

          # 内核 patch
          if [ -d hinlink-adapt/patches ]; then
            mkdir -p openwrt/target/linux/rockchip/patches-6.18
            cp -f hinlink-adapt/patches/*.patch openwrt/target/linux/rockchip/patches-6.18/ 2>/dev/null || true
          fi

          # U-Boot patch
          if [ -d hinlink-adapt/patches-uboot ]; then
            mkdir -p openwrt/package/boot/uboot-rockchip/patches
            cp -f hinlink-adapt/patches-uboot/upstream/*.patch openwrt/package/boot/uboot-rockchip/patches/ 2>/dev/null || true

            # 如有额外补丁
            if ls hinlink-adapt/patches-uboot/*.patch 1>/dev/null 2>&1; then
              for p in hinlink-adapt/patches-uboot/*.patch; do
                patch -p1 -d openwrt/package/boot/uboot-rockchip < "$p" || true
              done
            fi
          fi

          # 追加设备定义（armv8.mk）
          if [ -f hinlink-adapt/target/linux/rockchip/image/armv8.mk.hinlink ]; then
            cat hinlink-adapt/target/linux/rockchip/image/armv8.mk.hinlink \
              >> openwrt/target/linux/rockchip/image/armv8.mk
          fi

          echo "适配层注入完成"
          ls openwrt/target/linux/rockchip/files/arch/arm64/boot/dts/rockchip/ | grep -i hinlink || echo "（提示：DTS 可能已在官方源码中）"

      # ========== 3. 执行 diy-part1 ==========
      - name: 执行DIY_P1_SH
        run: |
          chmod +x "${GITHUB_WORKSPACE}/${DIY_P1_SH}"
          cd openwrt
          "${GITHUB_WORKSPACE}/${DIY_P1_SH}"

      # ========== 4. 更新 feeds ==========
      - name: 更新feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 再次确保冲突包被卸载
          ./scripts/feeds uninstall fancontrol luci-app-fancontrol luci-app-oled 2>/dev/null || true

      # ========== 5. 加载机型配置 + diy-part3 ==========
      - name: 加载config 执行DIY_P2_SH defconfig
        run: |
          if [ -e "${CONFIG_BUILD}" ]; then
            cp "${CONFIG_BUILD}" openwrt/.config
            echo "已加载配置: ${CONFIG_BUILD}"
          else
            echo "错误：找不到配置文件 ${CONFIG_BUILD}"
            exit 1
          fi

          chmod +x "${GITHUB_WORKSPACE}/${DIY_P2_SH}"
          cd openwrt
          "${GITHUB_WORKSPACE}/${DIY_P2_SH}"
          make defconfig

      # ========== 仅输出配置模式 ==========
      - name: 仅输出完整配置
        if: env.BUILD_CONFIG_ONLY == 'true'
        working-directory: ./openwrt
        run: |
          echo "========================================"
          echo "仅输出完整配置模式"
          echo "========================================"
          echo "当前配置: ${{ matrix.config }}"
          echo
          echo "========== 完整 .config =========="
          cat .config
          echo "========== 完整 .config 结束 =========="
          mkdir -p config-output
          cp .config "config-output/${{ matrix.config }}_${{ env.date1 }}_full.config"
          ls -lh config-output/

      - name: 上传完整配置
        if: env.BUILD_CONFIG_ONLY == 'true'
        uses: actions/upload-artifact@main
        with:
          name: config_${{ env.OPENWRT_NAME }}_${{ matrix.config }}_${{ env.date1 }}
          path: openwrt/config-output/*.config

      # ========== 下载 + 编译 ==========
      - name: 下载安装包
        if: env.BUILD_CONFIG_ONLY != 'true'
        working-directory: ./openwrt
        run: |
          make download -j"$(nproc)"
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译固件
        id: compile
        if: env.BUILD_CONFIG_ONLY != 'true'
        working-directory: ./openwrt
        run: |
          echo -e "$(nproc) thread compile"
          make -j"$(nproc)" || make -j1 || make -j1 V=s

      - name: 获取固件设备名字
        if: env.BUILD_CONFIG_ONLY != 'true'
        working-directory: ./openwrt
        run: |
          DEVICE_NAME=$(grep '^CONFIG_TARGET_.*_DEVICE_.*=y' .config | sed -r 's/^CONFIG_TARGET_(.*)_DEVICE_(.*)=y/\1_\2/' | head -n 1)
          if [ -n "$DEVICE_NAME" ]; then
            echo "DEVICE_NAME=$DEVICE_NAME" >> "$GITHUB_ENV"
          else
            echo "DEVICE_NAME=${{ matrix.config }}" >> "$GITHUB_ENV"
          fi

      - name: 上传bin目录文件
        if: steps.compile.outcome == 'success' && env.UPLOAD_BIN == 'true'
        uses: actions/upload-artifact@main
        with:
          name: bin_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
          path: openwrt/bin

      - name: 整理文件到firmware目录
        id: organize
        if: steps.compile.outcome == 'success'
        run: |
          mkdir -p firmware
          cp -v ./openwrt/.config "./firmware/${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}.config"

          find openwrt/bin/targets/*/*/ -maxdepth 1 -type f \
          \( -name "config.buildinfo" -o \
             -name "*.bin" -o \
             -name "*.img" -o \
             -name "*.img.gz" -o \
             -name "*.itb" -o \
             -name "*.ubi" -o \
             -name "*.trx" -o \
             -name "*.tar" \
          \) \
          -exec cp -v {} ./firmware/ \;

          cd firmware

          if [ -f config.buildinfo ]; then
            mv config.buildinfo \
              "${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_config.buildinfo"
          fi

          for file in *.bin *.img *.img.gz *.itb *.ubi *.trx *.tar; do
            [ -f "$file" ] || continue
            mv "$file" \
              "${{ env.date1 }}_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_$file"
          done

          echo "FIRMWARE=$GITHUB_WORKSPACE/firmware" >> "$GITHUB_ENV"

      - name: 上传firmware目录文件
        if: steps.organize.outcome == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@main
        with:
          name: firmware_${{ env.OPENWRT_NAME }}_${{ env.DEVICE_NAME }}_${{ env.date1 }}
          path: ${{ env.FIRMWARE }}

      - name: 生成release描述
        id: release
        if: steps.organize.outcome == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          touch release.txt
          echo "由衷感谢所有为 openwrt 无私奉献的大佬们" >> release.txt
          echo "主源码: immortalwrt/immortalwrt (${{ env.REPO_BRANCH }})" >> release.txt
          echo "适配来源: Beaverfffan/immortalwrt-hinlink" >> release.txt
          echo "当前配置: ${{ matrix.config }}" >> release.txt
          echo "📥 固件下载" >> release.txt

      - name: 发布至release
        if: steps.release.outcome == 'success'
        uses: softprops/action-gh-release@master
        with:
          files: ${{ env.FIRMWARE }}/*
          name: ${{ env.date3 }}-${{ matrix.config }}
          tag_name: ${{ env.date2 }}-${{ matrix.config }}
          body_path: release.txt

      # ========== 回写完整配置到仓库 ==========
      - name: config文件上传自动更新1
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: config文件上传自动更新2
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone -b main "https://github.com/${REPO}.git" main

      - name: config文件上传自动更新3
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/main/hinlink-all"
          cp ./openwrt/.config \
            "${GITHUB_WORKSPACE}/main/hinlink-all/${{ matrix.config }}.full.config"

          cd "$GITHUB_WORKSPACE/main"
          git add "hinlink-all/${{ matrix.config }}.full.config"

          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "add full config for ${{ matrix.config }} $(date '+%Y-%m-%d %H:%M:%S')"

            for i in 1 2 3 4 5; do
              git pull --rebase origin main || true
              if git push --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${REPO}.git" HEAD:main; then
                echo "push success"
                break
              fi
              echo "push failed, retry $i ..."
              sleep 10
            done
          fi

      - name: 查看磁盘使用情况
        if: (!cancelled())
        run: df -hT

      - name: 删除工作流
        uses: Mattraks/delete-workflow-runs@main
        with:
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 7
          keep_minimum_runs: 0
